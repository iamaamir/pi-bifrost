<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <title id="title">Illustrative Pi session with Bifrost</title>
  <desc id="desc">A Pi-like terminal shows the prompt “Explain this function,” an example answer, the selected openai-codex gpt-5.6-luna model in Pi’s footer, and Bifrost status. The model names and answer are examples, not a live session or defaults.</desc>
  <style>
    :root{color-scheme:light dark;--backdrop:#0d151d;--screen:#111a23;--text:#e2e6e9;--muted:#a6b0b8;--line:#435463;--user:#1b3040;--accent:#70acd0;--success:#81c995}
    @media(prefers-color-scheme:light){:root{--backdrop:#e9eff3;--screen:#f8fafb;--text:#17232c;--muted:#52616b;--line:#aab6be;--user:#e3edf4;--accent:#176b99;--success:#257545}}
    .frame{fill:var(--screen);stroke:var(--line);stroke-width:1.5}.user-block{fill:var(--user)}.rule{stroke:var(--line);stroke-width:1}.prompt{fill:var(--text);font-size:20px}.answer{fill:var(--text);font-size:19px}.footer{fill:var(--muted);font-size:16px}.status-lead{fill:var(--muted);font-size:16px}.status-on{fill:var(--success);font-size:16px;font-weight:650}.status-dot{fill:var(--success)}.caption{fill:var(--muted);font-size:15px}.caption-label{fill:var(--text);font-size:15px;font-weight:650}.small{fill:var(--muted);font-size:13px;letter-spacing:.08em}
    .stage{animation-duration:20s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
    .stage-prompt{animation-name:prompt-in}.stage-status{animation-name:status-in}.stage-model{animation-name:model-in}.stage-answer{animation-name:answer-in}
    @keyframes prompt-in{0%{opacity:0;transform:translateY(7px)}4%{opacity:1;transform:translateY(0)}95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @keyframes status-in{0%,10%{opacity:0;transform:translateY(7px)}14%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @keyframes model-in{0%,20%{opacity:0;transform:translateY(7px)}24%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @keyframes answer-in{0%,30%{opacity:0;transform:translateY(7px)}34%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.stage{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <rect width="720" height="430" rx="14" fill="var(--backdrop)"/>
  <text class="small" x="24" y="25">EXAMPLE PI SESSION</text>
  <rect class="frame" x="16" y="42" width="688" height="307" rx="7"/>
  <g class="stage stage-prompt">
    <rect class="user-block" x="28" y="66" width="664" height="61" rx="3"/>
    <text class="prompt" x="44" y="104">Explain this function.</text>
  </g>
  <g class="stage stage-answer">
    <text class="answer" x="36" y="183">It groups the entries by key, then returns</text>
    <text class="answer" x="36" y="209">each group as a new collection.</text>
  </g>
  <line class="rule" x1="16" y1="249" x2="704" y2="249"/>
  <text class="footer" x="30" y="275">~/project (main)</text>
  <g class="stage stage-model">
    <text class="footer" x="690" y="301" text-anchor="end">(openai-codex) gpt-5.6-luna</text>
  </g>
  <g class="stage stage-status">
    <circle class="status-dot" cx="34" cy="324" r="4"/>
    <text x="45" y="330"><tspan class="status-lead">Bifrost · </tspan><tspan class="status-on">on</tspan></text>
  </g>
  <text class="caption-label" x="24" y="380">Example route:</text>
  <text class="caption" x="24" y="402">general → openai-codex/gpt-5.6-luna</text>
  <text class="caption" x="24" y="422">Other model example: anthropic/claude-sonnet-4-5</text>
</svg>