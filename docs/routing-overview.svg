<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
  <title id="title">Example route through Pi-Bifrost</title>
  <desc id="desc">A prompt matches a tier and its configured model pool. AI A is selected by the configured strategy. AI B is excluded for cooldown. The selected route carries the prompt to Pi, which shows the answer.</desc>
  <style>
    :root{color-scheme:light dark;--backdrop:#0d151d;--text:#e2e6e9;--muted:#a6b0b8;--surface:#15212c;--surface-raised:#1c2b37;--line:#647783;--accent:#70acd0;--teal:#64d6c3;--selected-bg:#193244;--warning:#d6ad72;--stop:#cf8e8e}
    @media(prefers-color-scheme:light){:root{--backdrop:#f5f8fa;--text:#17232c;--muted:#475762;--surface:#fff;--surface-raised:#e7eef3;--line:#71818b;--accent:#176b99;--teal:#0a7c76;--selected-bg:#dcecf5;--warning:#855212;--stop:#982d2d}}
    .backdrop{fill:var(--backdrop)}.speech{fill:var(--surface-raised);stroke:var(--line);stroke-width:2}.tier{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}.pool{fill:var(--surface);stroke:var(--line);stroke-width:2}.candidate{fill:var(--surface-raised);stroke:var(--line);stroke-width:2}.chosen{fill:var(--selected-bg);stroke:var(--accent);stroke-width:3}.excluded{fill:var(--surface);stroke:var(--line);stroke-width:2}.terminal{fill:var(--surface-raised);stroke:var(--accent);stroke-width:2.5}
    .title{fill:var(--text);font-size:23px;font-weight:650}.body{fill:var(--text);font-size:20px}.muted{fill:var(--muted);font-size:18px}.selected-text{fill:var(--accent);font-size:20px;font-weight:700}.cooldown{fill:var(--warning);font-size:20px;font-weight:700}.step{fill:var(--muted);font-size:18px;font-weight:650;letter-spacing:.06em}
    .wire{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.wire-selected{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.route-halo{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.2;stroke-dasharray:1;stroke-dashoffset:0;animation:trace-route 20s linear infinite}.route-flow{fill:none;stroke:url(#selected-flow);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:trace-route 20s linear infinite}.packet-ring{fill:var(--backdrop);fill-opacity:.55;stroke:var(--accent);stroke-width:2;opacity:0}.wire-excluded{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:5 6;stroke-linecap:round;stroke-linejoin:round}.packet{fill:var(--accent);opacity:0}
    .scene{animation-duration:20s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
    .step-1{animation-name:stage-1}.step-2{animation-name:stage-2}.step-3{animation-name:stage-3}.step-4{animation-name:stage-4}.step-5{animation-name:stage-5}
    @keyframes stage-1{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
    @keyframes stage-2{0%,10%{opacity:0;transform:translateY(10px)}14%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
    @keyframes stage-3{0%,20%{opacity:0;transform:translateY(10px)}24%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
    @keyframes stage-4{0%,30%{opacity:0;transform:translateY(10px)}34%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
    @keyframes stage-5{0%,40%{opacity:0;transform:translateY(10px)}44%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
    #packet-first{animation:packet-first 20s linear infinite}#packet-next{animation:packet-next 20s linear infinite}#packet-route,.packet-ring{animation:packet-route 20s linear infinite}
    @keyframes packet-first{0%,14.5%{opacity:0;transform:translateX(0)}15%{opacity:1}18.5%{opacity:1;transform:translateX(31px)}19%{opacity:0;transform:translateX(40px)}100%{opacity:0;transform:translateX(40px)}}
    @keyframes packet-next{0%,24.5%{opacity:0;transform:translateX(0)}25%{opacity:1}28.5%{opacity:1;transform:translateX(45px)}29%{opacity:0;transform:translateX(54px)}100%{opacity:0;transform:translateX(54px)}}
    @keyframes trace-route{0%,44.5%{stroke-dashoffset:1}45%{stroke-dashoffset:1}50%,95%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
    @keyframes packet-route{0%,44.5%{opacity:0;transform:translate(0,0)}45%{opacity:1}47%{opacity:1;transform:translate(0,28px)}48%{opacity:1;transform:translate(32px,60px)}49.5%{opacity:1;transform:translate(212px,60px)}50%,100%{opacity:0;transform:translate(212px,60px)}}
    @media(prefers-reduced-motion:reduce){.scene,#packet-first,#packet-next,#packet-route,.packet-ring,.route-halo,.route-flow{animation:none!important}.scene{opacity:1!important;transform:none!important}.packet,.packet-ring{display:none!important}.route-halo,.route-flow{stroke-dashoffset:0!important}}
  </style>
  <defs><linearGradient id="selected-flow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="var(--accent)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient></defs>
  <rect class="backdrop" width="720" height="560" rx="18"/>
  <text class="step" x="28" y="34">EXAMPLE ROUTE</text>

  <g id="prompt" class="scene step-1">
    <path class="speech" d="M42 66H174a14 14 0 0 1 14 14v65a14 14 0 0 1-14 14H106l-18 18-4-18H42a14 14 0 0 1-14-14V80a14 14 0 0 1 14-14Z"/>
    <text class="step" x="48" y="96">01 · PROMPT</text>
    <text class="title" x="48" y="130">Fix this bug</text>
  </g>

  <g id="prompt-to-tier" class="scene step-2">
    <path class="wire" d="M188 117H229m-9-6 9 6-9 6"/>
    <circle id="packet-first" class="packet" cx="193" cy="117" r="6"/>
  </g>
  <g id="tier" class="scene step-2">
    <rect class="tier" x="232" y="76" width="170" height="82" rx="41"/>
    <text class="step" x="317" y="106" text-anchor="middle">02 · TIER</text>
    <text class="title" x="317" y="136" text-anchor="middle">Task group</text>
  </g>

  <g id="tier-to-pool" class="scene step-3">
    <path class="wire" d="M402 117H461m-9-6 9 6-9 6"/>
    <circle id="packet-next" class="packet" cx="407" cy="117" r="6"/>
  </g>
  <g id="model-pool" class="scene step-3">
    <rect class="pool" x="466" y="34" width="226" height="166" rx="14"/>
    <text class="step" x="480" y="64">03 · MODEL POOL</text>
    <text class="muted" x="480" y="91">Configured models</text>
    <rect class="candidate" x="480" y="108" width="96" height="68" rx="11"/>
    <text class="title" x="528" y="150" text-anchor="middle">AI A</text>
    <rect class="candidate" x="586" y="108" width="92" height="68" rx="11"/>
    <text class="title" x="632" y="150" text-anchor="middle">AI B</text>
  </g>

  <g id="candidate-branches" class="scene step-4">
    <path class="wire" d="M579 200V222"/>
    <path class="wire-selected" d="M579 222H240V269m-7-10 7 10 7-10"/>
    <path class="wire-excluded" d="M579 222H500V269m-7-10 7 10 7-10"/>
  </g>
  <g id="selection" class="scene step-4">
    <text class="step" x="28" y="255">04 · ELIGIBILITY</text>
    <rect class="chosen" x="142" y="273" width="196" height="86" rx="13"/>
    <text class="title" x="164" y="307">AI A</text>
    <text class="selected-text" x="164" y="338">✓ SELECTED</text>
    <rect class="excluded" x="402" y="273" width="196" height="86" rx="13"/>
    <text class="title" x="424" y="307">AI B</text>
    <text class="cooldown" x="424" y="338">× COOLDOWN</text>
    <text class="muted" x="28" y="382">Strategy picks</text>
    <text class="muted" x="28" y="406">an eligible AI.</text>
  </g>

  <g id="selected-route" class="scene step-5">
    <path class="route-halo" pathLength="1" d="M240 359V388Q240 420 272 420H452m-10-7 10 7-10 7"/>
    <path class="route-flow" pathLength="1" d="M240 359V388Q240 420 272 420H452m-10-7 10 7-10 7"/>
    <circle class="packet-ring" cx="240" cy="360" r="12"/>
    <circle id="packet-route" class="packet" cx="240" cy="360" r="7"/>
  </g>
  <g id="answer" class="scene step-5">
    <rect class="terminal" x="464" y="382" width="228" height="102" rx="10"/>
    <path class="wire" d="M464 413H692"/>
    <text class="step" x="482" y="405">05 · PI ANSWER</text>
    <text class="title" x="482" y="448">Pi shows the</text>
    <text class="title" x="482" y="474">answer from AI A</text>
  </g>
  <g id="notes" class="scene step-5">
    <text class="muted" x="30" y="520">Cache remembers tier choices.</text>
    <text class="muted" x="30" y="544">Auto can keep a successful AI in its tier while it remains eligible.</text>
  </g>
</svg>
