<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <title id="title">Illustrative Pi session with Bifrost</title>
  <desc id="desc">A Pi-like terminal shows the prompt “Explain this function,” an example answer, the selected openai-codex gpt-5.6-luna model in Pi’s footer, and Bifrost status. The model names and answer are examples, not a live session or defaults.</desc>
  <style>
    :root{color-scheme:light dark;--backdrop:#0d151d;--screen:#111a23;--text:#e2e6e9;--muted:#a6b0b8;--line:#435463;--user:#1b3040;--accent:#70acd0;--success:#81c995}
    @media(prefers-color-scheme:light){:root{--backdrop:#e9eff3;--screen:#f8fafb;--text:#17232c;--muted:#52616b;--line:#aab6be;--user:#e3edf4;--accent:#176b99;--success:#257545}}
    .frame{fill:var(--screen);stroke:var(--line);stroke-width:1.3}.user-block{fill:var(--user)}.rule{stroke:var(--line);stroke-width:1}.prompt{fill:var(--text);font-size:18px}.answer{fill:var(--text);font-size:16px}.footer{fill:var(--muted);font-size:14px}.status-lead{fill:var(--muted);font-size:14px}.status-on{fill:var(--success);font-size:14px;font-weight:650}.status-dot{fill:var(--success)}.caption{fill:var(--muted);font-size:14px}.caption-label{fill:var(--text);font-size:14px;font-weight:650}.small{fill:var(--muted);font-size:11px;letter-spacing:.06em}
    .stage{animation-duration:20s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}.stage-prompt{animation-name:prompt-in}.stage-status{animation-name:status-in}.stage-model{animation-name:model-in}.stage-answer{animation-name:answer-in}
    @keyframes prompt-in{0%{opacity:0;transform:translateY(7px)}4%{opacity:1;transform:translateY(0)}95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @keyframes status-in{0%,10%{opacity:0;transform:translateY(7px)}14%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @keyframes model-in{0%,20%{opacity:0;transform:translateY(7px)}24%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @keyframes answer-in{0%,30%{opacity:0;transform:translateY(7px)}34%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.stage{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <rect width="320" height="480" rx="12" fill="var(--backdrop)"/>
  <text class="small" x="14" y="20">EXAMPLE PI SESSION</text>
  <rect class="frame" x="10" y="34" width="300" height="294" rx="6"/>
  <g class="stage stage-prompt">
    <rect class="user-block" x="20" y="51" width="280" height="47" rx="3"/>
    <text class="prompt" x="30" y="81">Explain this function.</text>
  </g>
  <g class="stage stage-answer">
    <text class="answer" x="24" y="139">It groups entries by key.</text>
    <text class="answer" x="24" y="161">It returns each group as a</text>
    <text class="answer" x="24" y="183">new collection.</text>
  </g>
  <line class="rule" x1="10" y1="220" x2="310" y2="220"/>
  <text class="footer" x="20" y="243">~/project (main)</text>
  <g class="stage stage-model">
    <text class="footer" x="300" y="267" text-anchor="end">(openai-codex) gpt-5.6-luna</text>
  </g>
  <g class="stage stage-status">
    <circle class="status-dot" cx="24" cy="290" r="3.5"/>
    <text x="34" y="295"><tspan class="status-lead">Bifrost · </tspan><tspan class="status-on">on</tspan></text>
  </g>
  <text class="caption-label" x="14" y="357">Example route:</text>
  <text class="caption" x="14" y="379">general → openai-codex/</text>
  <text class="caption" x="14" y="400">gpt-5.6-luna</text>
  <text class="caption" x="14" y="424">Other model example:</text>
  <text class="caption" x="14" y="445">anthropic/claude-sonnet-4-5</text>
</svg>