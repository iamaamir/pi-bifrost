<svg xmlns="http://www.w3.org/2000/svg" width="320" height="724" viewBox="0 0 320 724" role="img" aria-labelledby="title desc" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
  <title id="title">Example route through Pi-Bifrost</title>
  <desc id="desc">A prompt matches a tier and its configured model pool. AI A is selected by the configured strategy. AI B is excluded for cooldown. The selected route carries the prompt to Pi, which shows the answer.</desc>
  <style>
    :root{color-scheme:light dark;--backdrop:#0d151d;--text:#e2e6e9;--muted:#a6b0b8;--surface:#15212c;--surface-raised:#1c2b37;--line:#647783;--accent:#70acd0;--teal:#64d6c3;--selected-bg:#193244;--warning:#d6ad72;--stop:#cf8e8e}
    @media(prefers-color-scheme:light){:root{--backdrop:#f5f8fa;--text:#17232c;--muted:#475762;--surface:#fff;--surface-raised:#e7eef3;--line:#71818b;--accent:#176b99;--teal:#0a7c76;--selected-bg:#dcecf5;--warning:#855212;--stop:#982d2d}}
    .backdrop{fill:var(--backdrop)}.speech{fill:var(--surface-raised);stroke:var(--line);stroke-width:1.8}.tier{fill:var(--surface);stroke:var(--accent);stroke-width:2}.pool{fill:var(--surface);stroke:var(--line);stroke-width:1.8}.candidate{fill:var(--surface-raised);stroke:var(--line);stroke-width:1.8}.chosen{fill:var(--selected-bg);stroke:var(--accent);stroke-width:2.5}.excluded{fill:var(--surface);stroke:var(--line);stroke-width:1.6;opacity:.75}.terminal{fill:var(--surface-raised);stroke:var(--accent);stroke-width:2}
    .title{fill:var(--text);font-size:20px;font-weight:650}.answer-copy{font-size:18px}.body{fill:var(--text);font-size:18px}.muted{fill:var(--muted);font-size:18px}.selected-text{fill:var(--accent);font-size:18px;font-weight:700}.cooldown{fill:var(--warning);font-size:18px;font-weight:700}.step{fill:var(--muted);font-size:18px;font-weight:650;letter-spacing:.03em}
    .wire{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wire-selected{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.route-halo{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.2;stroke-dasharray:1;stroke-dashoffset:0;animation:trace-route 20s linear infinite}.route-flow{fill:none;stroke:url(#selected-flow);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:trace-route 20s linear infinite}.packet-ring{fill:var(--backdrop);fill-opacity:.55;stroke:var(--accent);stroke-width:1.6;opacity:0}.wire-excluded{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 5;stroke-linecap:round;stroke-linejoin:round}.packet{fill:var(--accent);opacity:0}
    .scene{animation-duration:20s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}.step-1{animation-name:stage-1}.step-2{animation-name:stage-2}.step-3{animation-name:stage-3}.step-4{animation-name:stage-4}.step-5{animation-name:stage-5}
    @keyframes stage-1{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
    @keyframes stage-2{0%,10%{opacity:0;transform:translateY(8px)}14%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
    @keyframes stage-3{0%,20%{opacity:0;transform:translateY(8px)}24%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
    @keyframes stage-4{0%,30%{opacity:0;transform:translateY(8px)}34%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
    @keyframes stage-5{0%,40%{opacity:0;transform:translateY(8px)}44%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
    #packet-first{animation:packet-first 20s linear infinite}#packet-next{animation:packet-next 20s linear infinite}#packet-route,.packet-ring{animation:packet-route 20s linear infinite}
    @keyframes packet-first{0%,14.5%{opacity:0;transform:translateY(0)}15%{opacity:1}18.5%{opacity:1;transform:translateY(20px)}19%{opacity:0;transform:translateY(26px)}100%{opacity:0;transform:translateY(26px)}}
    @keyframes packet-next{0%,24.5%{opacity:0;transform:translateY(0)}25%{opacity:1}28.5%{opacity:1;transform:translateY(27px)}29%{opacity:0;transform:translateY(34px)}100%{opacity:0;transform:translateY(34px)}}
    @keyframes trace-route{0%,44.5%{stroke-dashoffset:1}45%{stroke-dashoffset:1}50%,95%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
    @keyframes packet-route{0%,44.5%{opacity:0;transform:translate(0,0)}45%{opacity:1}47%{opacity:1;transform:translateY(34px)}48%{opacity:1;transform:translate(20px,52px)}49.5%{opacity:1;transform:translate(70px,52px)}50%,100%{opacity:0;transform:translate(70px,52px)}}
    @media(prefers-reduced-motion:reduce){.scene,#packet-first,#packet-next,#packet-route,.packet-ring,.route-halo,.route-flow{animation:none!important}.scene{opacity:1!important;transform:none!important}.packet,.packet-ring{display:none!important}.route-halo,.route-flow{stroke-dashoffset:0!important}}
  </style>
  <defs><linearGradient id="selected-flow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="var(--accent)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient></defs>
  <rect class="backdrop" width="320" height="724" rx="16"/>
  <g id="prompt" class="scene step-1">
    <path class="speech" d="M28 14H292a12 12 0 0 1 12 12v39a12 12 0 0 1-12 12H170l-10 10-10-10H28a12 12 0 0 1-12-12V26a12 12 0 0 1 12-12Z"/>
    <text class="step" x="32" y="40">01 · PROMPT</text>
    <text class="title" x="32" y="67">“Fix this bug”</text>
  </g>
  <g id="prompt-to-tier" class="scene step-2">
    <path class="wire" d="M160 87V109m-5-7 5 7 5-7"/>
    <circle id="packet-first" class="packet" cx="160" cy="88" r="5"/>
  </g>
  <g id="tier" class="scene step-2">
    <rect class="tier" x="24" y="112" width="272" height="64" rx="32"/>
    <text class="step" x="160" y="139" text-anchor="middle">02 · MATCHED TIER</text>
    <text class="muted" x="160" y="164" text-anchor="middle">task group</text>
  </g>
  <g id="tier-to-pool" class="scene step-3">
    <path class="wire" d="M160 176V203m-5-7 5 7 5-7"/>
    <circle id="packet-next" class="packet" cx="160" cy="178" r="5"/>
  </g>
  <g id="model-pool" class="scene step-3">
    <rect class="pool" x="16" y="207" width="288" height="124" rx="12"/>
    <text class="step" x="32" y="234">03 · MODEL POOL</text>
    <text class="muted" x="32" y="258">Configured models for this tier</text>
    <path class="wire" d="M160 263V272M160 272H88V280M160 272H232V280"/>
    <rect class="candidate" x="25" y="282" width="126" height="40" rx="9"/>
    <text class="title" x="88" y="309" text-anchor="middle">AI A</text>
    <rect class="candidate" x="169" y="282" width="126" height="40" rx="9"/>
    <text class="title" x="232" y="309" text-anchor="middle">AI B</text>
  </g>
  <g id="candidate-branches" class="scene step-4">
    <path class="wire" d="M160 331V350"/>
    <path class="wire-selected" d="M160 350H88V379m-5-7 5 7 5-7"/>
    <path class="wire-excluded" d="M160 350H232V379m-5-7 5 7 5-7"/>
  </g>
  <g id="selection" class="scene step-4">
    <rect class="pool" x="16" y="383" width="288" height="126" rx="12"/>
    <text class="step" x="160" y="408" text-anchor="middle">04 · CHECK ELIGIBILITY</text>
    <text class="muted" x="160" y="432" text-anchor="middle">Strategy picks one eligible AI</text>
    <rect class="chosen" x="25" y="442" width="126" height="58" rx="9"/>
    <text class="title" x="88" y="466" text-anchor="middle">AI A</text>
    <text class="selected-text" x="88" y="490" text-anchor="middle">Selected</text>
    <rect class="excluded" x="169" y="442" width="126" height="58" rx="9"/>
    <text class="title" x="232" y="466" text-anchor="middle">AI B</text>
    <text class="cooldown" x="232" y="490" text-anchor="middle">× Cooldown</text>
  </g>
  <g id="selected-route" class="scene step-5">
    <path class="route-halo" pathLength="1" d="M88 500V532Q88 550 106 550H153m-7-5 7 5-7 5"/>
    <path class="route-flow" pathLength="1" d="M88 500V532Q88 550 106 550H153m-7-5 7 5-7 5"/>
    <circle class="packet-ring" cx="88" cy="501" r="10"/>
    <circle id="packet-route" class="packet" cx="88" cy="501" r="5"/>
  </g>
  <g id="answer" class="scene step-5">
    <rect class="terminal" x="16" y="554" width="288" height="66" rx="9"/>
    <path class="wire" d="M16 580H304"/>
    <text class="step" x="32" y="574">05 · PI ANSWER</text>
    <text class="title answer-copy" x="32" y="608">Pi shows the answer from AI A</text>
  </g>
  <g id="notes" class="scene step-5">
    <text class="muted" x="160" y="650" text-anchor="middle">Cache remembers tier choices.</text>
    <text class="muted" x="160" y="675" text-anchor="middle">Auto can keep a successful AI</text>
    <text class="muted" x="160" y="699" text-anchor="middle">in its tier while it remains eligible.</text>
  </g>
</svg>
