name: Docs links (scheduled)

on:
  schedule:
    # Weekly, off the top-of-hour load window. Advisory only; never a merge gate.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external links in documentation
        # `fail: false` keeps link failures advisory; a broken action or setup
        # still turns the scheduled run red so the check cannot rot silently.
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2 # v2.6.1
        with:
          fail: false
          format: markdown
          jobSummary: true
          output: lychee/out.md
          args: >-
            --config .lychee.toml
            --no-progress
            './*.md'
            './docs/**/*.md'
