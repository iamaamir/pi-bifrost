name: Static analysis

on:
  pull_request:
    # A policy acknowledgment changes the override, so applying or removing the
    # label must re-evaluate the gate instead of leaving the old verdict.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The push leg compares against the previous tip. A shallow checkout
          # would make that revision unavailable and fail the gate closed.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Architecture boundaries
        run: npm run check:arch
      - name: Dead code and dependency hygiene
        run: npm run check:dead-code
      - name: Structural rules and rule self-tests
        run: npm run check:ast
      - name: Copy-paste detection
        run: npm run check:duplication
      # The target is measured from source, so no generated metrics file is
      # committed. Fetch the base revision explicitly: a fork's history need not
      # contain the base commit, so `origin` alone is not enough.
      - name: Fetch the base revision
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.clone_url }}
        run: git fetch --no-tags --depth=1 "$BASE_REPO" "$BASE_SHA"
      # The base revision is the trust anchor for analyzer, threshold, and CI
      # policy changes. A policy-changing pull request must carry the
      # quality-policy-change label so the override is visible in review.
      - name: Complexity against the base revision
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BIFROST_COMPLEXITY_ALLOW_POLICY_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'quality-policy-change') && '1' || '' }}
        run: npm run check:complexity:base -- "$BASE_SHA"
      # A push to main is the merge of a pull request that already passed the
      # label-gated review above; this leg re-checks the metric against the
      # previous tip so a broken merge is still visible.
      - name: Complexity against the previous revision
        if: github.event_name != 'pull_request'
        env:
          BIFROST_COMPLEXITY_BASE: ${{ github.event.before || 'HEAD^' }}
          BIFROST_COMPLEXITY_ALLOW_POLICY_CHANGE: "1"
        run: npm run check:complexity

  integration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Node
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify host integration contracts
        run: npm run check:contracts

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Go for the pinned actionlint build
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: Install actionlint 1.7.12
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint workflow syntax and expressions
        run: npm run check:actions
      - name: Audit workflow security with Zizmor
        run: |
          pipx install zizmor==1.31.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: |
          zizmor --format plain .github/workflows

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go for the pinned Gitleaks boundary checks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: Install Gitleaks 8.24.3 for boundary checks and push scans
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify secret scan boundaries
        run: bash scripts/test-gitleaks-pr-boundaries.sh
      - name: Bind Gitleaks to the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          first_pr_commit="$(git rev-list --first-parent --reverse \
            "$BASE_SHA..$HEAD_SHA" | sed -n '1p')"
          if [ -z "$first_pr_commit" ]; then
            echo "Could not determine the first pull request commit" >&2
            exit 1
          fi
          echo "BASE_REF=$first_pr_commit" >> "$GITHUB_ENV"
      - name: Scan commits for secrets
        # v3
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The personal-account action does not require GITLEAKS_LICENSE.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
      - name: Scan all introduced commits and merge resolutions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
        run: |
          set -o pipefail
          scripts/scan-gitleaks-pr-history.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Scan commits introduced by this push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
        run: |
          set -o pipefail
          test "$AFTER_SHA" = "$(git rev-parse HEAD)"
          scripts/scan-gitleaks-pr-history.sh "$BEFORE_SHA" "$AFTER_SHA"

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate revision with history for a baseline scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: python -m pip install semgrep==1.182.0
      - name: Test the repository rules against their fixtures
        run: semgrep --test --config semgrep/ tests/semgrep/targets/
      - name: Scan only findings introduced by this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          semgrep scan --config semgrep/ --error --baseline-commit "$BASE_SHA"
          --metrics=off --disable-version-check
      - name: Scan the full tree outside pull requests
        if: github.event_name != 'pull_request'
        run: >-
          semgrep scan --config semgrep/ --error --metrics=off
          --disable-version-check

  # The upstream reusable workflow diffs dependency findings between the target
  # branch and the pull request, so only newly introduced vulnerabilities fail.
  osv-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    # yamllint disable-line rule:line-length
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
