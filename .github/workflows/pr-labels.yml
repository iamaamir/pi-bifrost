name: PR labels

# One router for every opt-in PR check. A `labeled` event runs only the check
# named by the new label; an unrelated label therefore cannot rerun a check that
# is already attached. A `synchronize` event reruns every check whose label is
# still attached. Removing a label produces no run and stops future reruns.
# Checks execute PR code, so this stays on `pull_request` with a read-only token.
# Local `uses:` stays `./...`: the pinned actionlint 1.7.12 cannot parse `$/`.
# Concurrency is per job: a new label must not cancel a different running check,
# but a new commit still cancels an outdated run of the same check.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  campaign:
    if: >-
      (github.event.action == 'labeled' &&
       github.event.label.name == 'ci:campaign') ||
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'ci:campaign'))
    uses: ./.github/workflows/campaign.yml # zizmor: ignore[self-repository]
    concurrency:
      group: pr-labels-campaign-${{ github.event.pull_request.number }}
      cancel-in-progress: true

  pi-compatibility:
    if: >-
      (github.event.action == 'labeled' &&
       github.event.label.name == 'ci:pi-compatibility') ||
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'ci:pi-compatibility'))
    uses: ./.github/workflows/pi-compatibility.yml # zizmor: ignore[self-repository]
    concurrency:
      group: pr-labels-pi-compatibility-${{ github.event.pull_request.number }}
      cancel-in-progress: true

  mutation:
    # Diagnostic only: unlike release-gates, this check is not required for a merge.
    if: >-
      (github.event.action == 'labeled' &&
       github.event.label.name == 'ci:mutation') ||
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'ci:mutation'))
    uses: ./.github/workflows/mutation.yml # zizmor: ignore[self-repository]
    concurrency:
      group: pr-labels-mutation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
