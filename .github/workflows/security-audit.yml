name: Security audit

on:
  # This workflow is dispatch-only; scheduled workflows run from default-branch content.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go for the pinned Gitleaks build
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: Install Gitleaks 8.30.1
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan all commits
        run: npm run check:secrets:history
      # The gate report is JSON for the toolbox. SARIF is a second render of the
      # same scan, so Security-tab alerts never change whether the gate passes.
      - name: Render Gitleaks findings as SARIF
        if: ${{ !cancelled() }}
        run: |
          gitleaks git --redact --no-banner --config .gitleaks.toml \
            --report-format sarif --report-path gitleaks.sarif --exit-code 0 .
      - name: Upload Gitleaks SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sast-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: python -m pip install semgrep==1.182.0
      - name: Test repository rules
        run: semgrep --test --config semgrep/ tests/semgrep/targets/
      - name: Scan the full tree
        run: semgrep scan --config semgrep/ --error --metrics=off --disable-version-check
      - name: Render Semgrep findings as SARIF
        if: ${{ !cancelled() }}
        run: >-
          semgrep scan --config semgrep/ --sarif --output semgrep.sarif
          --metrics=off --disable-version-check
      - name: Upload Semgrep SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go for the pinned actionlint build
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: Install actionlint and Zizmor
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pipx install zizmor==1.31.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: npm run check:actions
      - name: Audit workflow security
        run: zizmor --format plain .github/workflows
