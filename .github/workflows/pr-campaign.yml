name: PR Campaign

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  campaign:
    if: >-
      (github.event.action == 'labeled' &&
       github.event.label.name == 'ci:campaign') ||
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'ci:campaign'))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: pr-campaign-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      CAMPAIGN_REPEATS: "3"
      CAMPAIGN_SEED: "1729"

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bounded campaign inputs
        run: >-
          node scripts/campaign-run.mjs --name bounds
          --repeat "$CAMPAIGN_REPEATS" --seed-base "$CAMPAIGN_SEED"
          --validate-only -- node --version

      - name: Seeded property campaign
        run: >-
          node scripts/campaign-run.mjs --name properties
          --repeat "$CAMPAIGN_REPEATS" --seed-base "$CAMPAIGN_SEED"
          --timeout-ms 600000 --out "$RUNNER_TEMP/bifrost-campaign" --
          node --test --experimental-strip-types
          tests/model-selection-properties.test.ts
          tests/classifier-properties.test.ts
          tests/discovery-properties.test.ts

      - name: Reliability replay-control campaign
        run: >-
          node scripts/campaign-run.mjs --name reliability
          --repeat "$CAMPAIGN_REPEATS" --seed-base "$CAMPAIGN_SEED"
          --timeout-ms 600000 --out "$RUNNER_TEMP/bifrost-campaign" --
          node --test --experimental-strip-types
          tests/reliability-state-machine.test.ts
          tests/reliability-v2-state-machine.test.ts
          tests/reliability-filter-properties.test.ts
          tests/cache-properties.test.ts

      - name: Bounded integration repeats
        run: >-
          node scripts/campaign-run.mjs --name integration
          --repeat "$CAMPAIGN_REPEATS" --seed-base "$CAMPAIGN_SEED"
          --timeout-ms 1200000 --out "$RUNNER_TEMP/bifrost-campaign" --
          npm run test:integration

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-campaign-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bifrost-campaign/
          if-no-files-found: ignore
          retention-days: 14
