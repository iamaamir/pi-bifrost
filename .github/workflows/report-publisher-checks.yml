name: Report publisher checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  report-publisher-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node --test tests/ci-report-publish.test.mjs
