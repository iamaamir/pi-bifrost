name: Acceptance report

on:
  # zizmor: ignore[dangerous-triggers] This trusted publisher runs only default-branch
  # code, validates artifact metadata, and never executes pull-request code.
  workflow_run:
    workflows: [Verification]
    types: [in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: acceptance-report-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate report artifact metadata
        id: report
        if: github.event.action == 'completed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-report-publish.mjs --prepare
        continue-on-error: true
      - name: Download the named report artifact
        if: github.event.action == 'completed' && steps.report.outputs.artifact-id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ steps.report.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/bifrost-acceptance-report
      - name: Update the PR acceptance report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIFROST_REPORT_DIR: ${{ runner.temp }}/bifrost-acceptance-report
        run: node scripts/ci-report-publish.mjs
