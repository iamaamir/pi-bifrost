name: Pi compatibility

on:
  workflow_call:

permissions:
  contents: read

# Pinned baseline and current Pi, installed into node_modules only (no tracked
# package or lock edit, no credentials), with real native SDK, process,
# package-consumer, and typecheck checks. The pinned verify-release preflight
# still demands 1.4.0 and is deliberately not used as an alternate-version
# oracle; release-gates keeps running it pinned.
jobs:
  pi-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pi:
          - "1.3.0"
          - "1.4.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR caller must measure its head, never the ephemeral merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the pinned Pi version without editing tracked dependency files
        env:
          PI_VERSION: ${{ matrix.pi }}
        # zizmor: ignore[adhoc-packages] The matrix intentionally installs an
        # alternate Pi version without touching the tracked lockfile, then
        # verifies the tree is unchanged.
        run: |
          # Keep the baseline's locked transitive packages from npm ci.
          if [ "$PI_VERSION" != "1.4.0" ]; then
            npm install --no-save --package-lock=false --no-audit --no-fund \
              "@earendil-works/pi-ai@$PI_VERSION" \
              "@earendil-works/pi-coding-agent@$PI_VERSION"
          fi
          test "$(node -p "require('./node_modules/@earendil-works/pi-ai/package.json').version")" = "$PI_VERSION"
          test "$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")" = "$PI_VERSION"
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "compatibility install changed tracked files" >&2
            exit 1
          fi
      - name: Record installed versions
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          node -p "JSON.stringify({ expected: process.env.PI_VERSION, node: process.version, piAi: require('./node_modules/@earendil-works/pi-ai/package.json').version, piCodingAgent: require('./node_modules/@earendil-works/pi-coding-agent/package.json').version }, null, 2)" | tee "$RUNNER_TEMP/pi-compatibility-versions.json"
      - name: Typecheck against the matrix Pi version
        run: npm run typecheck
      - name: Run native SDK, process, and package consumer tests
        run: >-
          node --test --experimental-strip-types
          tests/router-package.test.mjs
          tests/integration/native-classifier.test.mjs
          tests/integration/native-faux-provider.test.mjs
          tests/integration/native-faux-lifecycle.test.mjs
          tests/integration/native-tool-continuation.test.mjs
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-compatibility-${{ matrix.pi }}-${{ github.event.pull_request.head.sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-compatibility-versions.json
          if-no-files-found: ignore
          retention-days: 14
